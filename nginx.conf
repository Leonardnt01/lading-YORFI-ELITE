server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  # Sin esto, cada escaneo de rutas inexistentes escribe una línea de error en el log.
  log_not_found off;

  # Archivos ocultos (.env, .git, .netrc, etc.): respuesta rápida y sin log.
  location ~ /\. {
    access_log off;
    log_not_found off;
    return 404;
  }

  # Mapas de código fuente: no se publican.
  location ~* \.map$ {
    access_log off;
    log_not_found off;
    return 404;
  }

  # Los navegadores piden /favicon.ico aunque la página declare otros iconos.
  location = /favicon.ico {
    access_log off;
    try_files /favicon-64.png =404;
  }

  # Archivos con hash en el nombre: caché larga e inmutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Medios y fuentes estáticas.
  location ~* \.(?:png|jpe?g|webp|svg|mp4|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;
}
